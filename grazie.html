<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messaggio inviato — Papi Nerd</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1014">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='%2300e0c6'/></svg>">
<style>
  :root{--bg:#0f1014;--panel:#181a21;--ink:#f2f3f7;--muted:#a8adbd;--accent:#00e0c6;--accent2:#ff4d6d;--line:#2a2d38}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    display:grid;place-items:center;
    padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55;overflow-x:hidden;
  }
  body::before,body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none}
  body::before{background:radial-gradient(60vmax 60vmax at 8% -6%, rgba(0,224,198,.28), transparent 62%)}
  body::after{background:radial-gradient(62vmax 62vmax at 96% 106%, rgba(255,77,109,.26), transparent 62%)}
  .box{
    position:relative;z-index:1;
    max-width:420px;width:100%;
    padding:34px 24px;text-align:center;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
  }
  .tick{
    width:60px;height:60px;margin:0 auto 16px;
    display:grid;place-items:center;font-size:1.7rem;
    background:rgba(0,224,198,.12);border:1px solid rgba(0,224,198,.3);border-radius:50%;
  }
  h1{margin:0 0 8px;font-size:1.4rem}
  p{margin:0 0 22px;color:var(--muted)}
  a.torna{
    display:inline-block;min-height:48px;padding:13px 26px;
    font-weight:700;color:#08131a;background:var(--accent);
    border-radius:12px;text-decoration:none;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="tick" aria-hidden="true">✓</div>
    <h1>Messaggio inviato</h1>
    <p>Grazie! Ti rispondo appena posso.</p>
    <a class="torna" href="link.html">Torna ai link</a>
  </div>
</body>
</html>
